[package]
name = "korob"
version = "0.1.0"
description = "A swift cheatsheet & hotkey catalog for active applications on Wayland (Umbriel)"
authors = ["koresent"]
edition = "2024"

[lib]
name = "korob_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
walkdir = "2"
rfd = "0.18"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
